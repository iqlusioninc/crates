name: pqseed

on:
  pull_request:
    paths:
      - "pqseed/**"
      - "bip32/**"
      - "Cargo.*"
      - ".github/workflows/pqseed.yml"
  push:
    branches: main

defaults:
  run:
    working-directory: pqseed

env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-Dwarnings"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - 1.85.0 # MSRV
          - stable
        target:
          - thumbv7em-none-eabi
          - wasm32-unknown-unknown
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.target }}
          override: true
          profile: minimal
      - run: cargo build --target ${{ matrix.target }} --release --no-default-features
      - run: cargo build --target ${{ matrix.target }} --release --all-features

  test:
    strategy:
      matrix:
        platform:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        toolchain:
          - 1.85.0 # MSRV
          - stable
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.toolchain }}
          override: true
          profile: minimal
      - run: cargo test --release --no-default-features
      - run: cargo test --release --no-default-features --features bip39
      - run: cargo test --release --no-default-features --features ml-dsa
      - run: cargo test --release --no-default-features --features slh-dsa
      - run: cargo test --release --all-features
