[package]
name = "pqseed"
version = "0.1.0"
description = "Deterministic post-quantum keys from BIP39 mnemonics using Project Eleven's BIP85 scheme"
license = "Apache-2.0 OR MIT"
homepage = "https://github.com/iqlusioninc/crates/"
repository = "https://github.com/iqlusioninc/crates/tree/main/pqseed"
categories = ["cryptography", "no-std"]
keywords = ["crypto", "bip39", "bip85", "post-quantum", "derivation"]
readme = "README.md"
edition = "2024"
rust-version = "1.85"

[dependencies]
bip32 = { version = "0.6", path = "../bip32", default-features = false, features = ["secp256k1"] }
hmac = { version = "0.13", default-features = false }
sha2 = { version = "0.11", default-features = false }
zeroize = { version = "1", default-features = false }

# optional dependencies
bip39 = { version = "2", optional = true, default-features = false, features = ["alloc", "zeroize"] }
ml-dsa = { version = "0.1.1", optional = true, default-features = false, features = ["zeroize"] }
slh-dsa = { version = "=0.2.0-rc.5", optional = true, default-features = false, features = ["zeroize"] }

[dev-dependencies]
hex-literal = "1"

[features]
default = ["bip39", "ml-dsa", "slh-dsa"]
bip39 = ["dep:bip39"]
ml-dsa = ["dep:ml-dsa"]
slh-dsa = ["dep:slh-dsa"]

[package.metadata.docs.rs]
all-features = true
