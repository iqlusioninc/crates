[package]
name = "bip32"
version = "0.6.0-pre.1"
description = """
BIP32 hierarchical key derivation implemented in a generic, no_std-friendly
manner. Supports deriving keys using the pure Rust k256 crate or the
C library-backed secp256k1 crate
"""
authors = ["Tony Arcieri <tony@iqlusion.io>"]
license = "Apache-2.0 OR MIT"
homepage = "https://github.com/iqlusioninc/crates/"
repository = "https://github.com/iqlusioninc/crates/tree/main/bip32"
categories = ["cryptography", "no-std"]
keywords = ["crypto", "bip32", "bip39", "derivation", "mnemonic"]
readme = "README.md"
edition  = "2024"
rust-version = "1.85"

[dependencies]
bs58 = { version = "0.5", default-features = false, features = ["check"] }
hmac = { version = "0.13", default-features = false }
rand_core = { version = "0.10", default-features = false }
ripemd = { version = "0.2", default-features = false }
sha2 = { version = "0.11", default-features = false }
subtle = { version = "2", default-features = false }
zeroize = { version = "1", default-features = false }

# optional dependencies
bip39 = { version = "2", optional = true, default-features = false }
k256 = { version = "0.14", optional = true, default-features = false, features = ["ecdsa", "sha256"] }
secp256k1-ffi = { package = "secp256k1", version = "0.33", optional = true, default-features = false }

[dev-dependencies]
bip39 = { version = "2", features = ["rand"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
hex-literal = "1"

[features]
default = ["bip39", "secp256k1"]
alloc = ["secp256k1-ffi?/alloc", "zeroize/alloc"]
bip39 = ["dep:bip39"]
secp256k1 = ["k256"]

[package.metadata.docs.rs]
all-features = true
