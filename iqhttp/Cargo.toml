[package]
name    = "iqhttp"
version = "0.3.0-pre"
description = """
iqlusion's HTTPS toolkit. Provides a high-level wrapper around hyper, with
built-in SSL/TLS support based on rustls.
"""
authors      = ["Tony Arcieri <tony@iqlusion.io>", "Shella Stephens <shella@iqlusion.io>"]
homepage     = "https://github.com/iqlusioninc/crates/"
repository   = "https://github.com/iqlusioninc/crates/tree/main/iqhttp"
license      = "Apache-2.0 OR MIT"
categories   = ["network-programming", "web-programming::http-client"]
keywords     = ["api", "client", "http", "rest", "web"]
readme       = "README.md"
edition      = "2024"
rust-version = "1.85"

[dependencies]
http-body-util = "0.1.5"
hyper = { version = "1.12", features = ["client", "http1"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "native-tokio", "ring", "tls12"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] } # >= 0.23.46 for RUSTSEC-2026-0349

# optional dependencies
serde = { version = "1", optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread"] }

[features]
json = ["serde", "serde_json"]
proxy = ["hyper-util/client-proxy"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
